openapi: 3.0.3
info:
  title: Gestor de Usuarios e Identificación - Subsonic Festival
  description: >
    API completa para la gestión de cuentas, autenticación OAuth2 y perfiles,
    adaptada a los perfiles de visitante, cliente, proveedor y administrador.
  version: 3.2.0


servers:
  - url: https://api.subsonicfestival.com/v1
    description: API Gateway


security:
  - OAuth2: []


tags:
  - name: Autenticación y Registro
    description: Endpoints abiertos para visitantes (registro, login y recuperación de cuenta)
  - name: Mi Perfil (Cliente / Proveedor)
    description: Autogestión y consulta de datos del propio usuario autenticado
  - name: Administración
    description: Moderación, suspensión de cuentas y soporte exclusivo para el rol Admin
  - name: Uso Interno
    description: Endpoints protegidos para la comunicación entre microservicios/gestores


paths:
  # ==========================================
  # AUTENTICACIÓN Y REGISTRO (Visitantes / Usuarios)
  # ==========================================
  /auth/register:
    post:
      tags: [Autenticación y Registro]
      summary: Registro de nuevos usuarios (Cliente o Proveedor)
      description: Permite a un visitante registrarse aportando sus datos, rol y detalles específicos si es proveedor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistro'
      responses:
        '201':
          description: Usuario registrado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Datos de registro inválidos o correo ya registrado


  /auth/login:
    post:
      tags: [Autenticación y Registro]
      summary: Iniciar sesión
      description: Autentica al usuario mediante credenciales y devuelve un token JWT seguro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesión exitoso con token de acceso


  /auth/logout:
    post:
      tags: [Autenticación y Registro]
      summary: Cerrar sesión
      description: Invalida el token actual del usuario.
      responses:
        '200':
          description: Sesión cerrada correctamente


  /auth/verify:
    get:
      tags: [Autenticación y Registro]
      summary: Verificar identidad del usuario
      description: Valida la vigencia y validez del token JWT recibido en la cabecera.
      responses:
        '200':
          description: Token válido, usuario autorizado
        '401':
          description: Token no recibido o inválido


  /auth/forgot-password:
    post:
      tags: [Autenticación y Registro]
      summary: Solicitar recuperación de contraseña
      description: Envía un enlace temporal al correo electrónico registrado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Correo de recuperación enviado


  /auth/verify-email:
    post:
      tags: [Autenticación y Registro]
      summary: Verificar dirección de correo electrónico
      description: Confirma el email mediante el código recibido tras el registro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo:
                  type: string
      responses:
        '200':
          description: Correo verificado con éxito


  # ==========================================
  # MI PERFIL (Autogestión Cliente / Proveedor)
  # ==========================================
  /usuarios/perfil:
    get:
      tags: [Mi Perfil (Cliente / Proveedor)]
      summary: Consultar los datos del perfil propio
      description: Permite a un cliente o proveedor consultar su información personal y de servicio.
      responses:
        '200':
          description: Perfil devuelto con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
    patch:
      tags: [Mi Perfil (Cliente / Proveedor)]
      summary: Modificar parcialmente los datos del perfil propio
      description: Permite actualizar campos específicos (ej. dirección, nombre, descripción del servicio) sin enviar el objeto completo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEdicion'
      responses:
        '200':
          description: Perfil actualizado correctamente
    delete:
      tags: [Mi Perfil (Cliente / Proveedor)]
      summary: Eliminar la propia cuenta
      description: Da de baja la cuenta del usuario en la plataforma.
      responses:
        '204':
          description: Cuenta eliminada con éxito


  /usuarios/historial-espacios:
    get:
      tags: [Mi Perfil (Cliente / Proveedor)]
      summary: Consultar el historial de participación del proveedor
      description: Permite al proveedor consultar los eventos y espacios en los que ha participado mediante los vínculos de su ID.
      security:
        - OAuth2: [proveedor]
      responses:
        '200':
          description: Lista de eventos y espacios alquilados


  # ==========================================
  # ADMINISTRACIÓN (Moderación y Soporte)
  # ==========================================
  /usuarios/admin:
    get:
      tags: [Administración]
      summary: Listar todos los usuarios del sistema
      description: Permite al administrador visualizar el listado completo de cuentas registradas (clientes y proveedores).
      security:
        - OAuth2: [admin]
      responses:
        '200':
          description: Listado de usuarios obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'


  /usuarios/admin/{user_id}:
    put:
      tags: [Administración]
      summary: Actualizar información de cualquier usuario
      description: Permite al administrador corregir o actualizar datos de un usuario por motivos de soporte.
      security:
        - OAuth2: [admin]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEdicion'
      responses:
        '200':
          description: Usuario actualizado por administración
    delete:
      tags: [Administración]
      summary: Eliminar un usuario del sistema (Moderación)
      description: Elimina una cuenta de forma permanente por incumplimiento de normas.
      security:
        - OAuth2: [admin]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Usuario eliminado correctamente


  /usuarios/admin/{user_id}/estado:
    patch:
      tags: [Administración]
      summary: Suspender o activar una cuenta
      description: Modifica el estado de acceso (bloqueo/desbloqueo) de un usuario sin borrar sus datos.
      security:
        - OAuth2: [admin]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [activo, suspendido]
      responses:
        '200':
          description: Estado de la cuenta modificado exitosamente


  /usuarios/admin-password-reset/{user_id}:
    put:
      tags: [Administración]
      summary: Modificación forzada de la contraseña de un usuario
      description: Herramienta de soporte técnico para reasignar credenciales bloqueadas.
      security:
        - OAuth2: [admin]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevaPassword]
              properties:
                nuevaPassword:
                  type: string
      responses:
        '200':
          description: Contraseña modificada exitosamente


  # ==========================================
  # USO INTERNO (Comunicación entre Gestores)
  # ==========================================
  /usuarios/{user_id}/verificar-rol:
    get:
      tags: [Uso Interno]
      summary: Comprobación del rol del usuario para otros gestores
      description: Endpoint consumido internamente por el Gestor de Espacios o de Inventario/Pedidos para verificar privilegios.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: rolEsperado
          in: query
          required: true
          schema:
            type: string
            enum: [cliente, proveedor]
      responses:
        '200':
          description: Confirmación del rol del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  rolValido:
                    type: boolean


components:
  securitySchemes:
    OAuth2:
      type: http
      scheme: bearer
      bearerFormat: JWT


  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [cliente, proveedor, visitante, admin]
        estado:
          type: string
          enum: [activo, suspendido]
        emailVerificado:
          type: boolean
        tipoServicio:
          type: string
          description: Tipo de servicio ofertado si es proveedor (comida, bebida, merchandising u otro)
        descripcionServicio:
          type: string


    UsuarioRegistro:
      type: object
      required: [nombre, correo, password, rol]
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
        password:
          type: string
        rol:
          type: string
          enum: [cliente, proveedor]
        tipoServicio:
          type: string
          description: Obligatorio si el rol es proveedor
        descripcionServicio:
          type: string


    UsuarioEdicion:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
        tipoServicio:
          type: string
        descripcionServicio:
          type: string


    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
        password:
          type: string


    EmailRequest:
      type: object
      required: [correo]
      properties:
        correo:
          type: string
          format: email


