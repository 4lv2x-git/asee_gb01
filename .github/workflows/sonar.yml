name: SonarCloud - Grounds

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: Análisis SonarCloud (componente Grounds)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/components/subsonic-grounds/requirements.txt

      - name: Instalar dependencias
        working-directory: backend/components/subsonic-grounds
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Ejecutar tests con cobertura
        working-directory: backend/components/subsonic-grounds
        run: python -m pytest tests --cov=app --cov-report=xml:coverage.xml

      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
