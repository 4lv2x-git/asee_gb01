# Configuración del servidor
server.port=${SERVER_PORT:8080}
spring.application.name=subsonic-frontend

# Evita cachear los recursos durante el desarrollo
spring.web.resources.cache.period=0

# URL base del microservicio subsonic-users-auth (API bajo /v1)
subsonic.users-auth.url=${USERS_AUTH_API_URL:http://localhost:8000}

# Vistas Thymeleaf sin cache durante el desarrollo
spring.thymeleaf.cache=false

# La sesion del navegador dura lo mismo que el JWT emitido por el microservicio
server.servlet.session.timeout=60m

# La sesion se transporta solo en la cookie JSESSIONID (sin ;jsessionid en URLs)
server.servlet.session.tracking-modes=cookie
