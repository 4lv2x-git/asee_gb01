# Configuración del servidor
server.port=${SERVER_PORT:8080}
spring.application.name=subsonic-frontend

# Evita cachear los recursos durante el desarrollo
spring.web.resources.cache.period=0
spring.thymeleaf.check-template-location=false

# URLs internas de los microservicios. El frontend solo comunica con este gateway.
gateway.events-url=${GATEWAY_EVENTS_URL:http://localhost:8000}
gateway.artists-url=${GATEWAY_ARTISTS_URL:http://localhost:8002}
gateway.auth-url=${GATEWAY_AUTH_URL:http://localhost:8003}
gateway.inventory-url=${GATEWAY_INVENTORY_URL:http://localhost:8081}
