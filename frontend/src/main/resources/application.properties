# Configuración del servidor
server.port=${SERVER_PORT:8080}
spring.application.name=subsonic-frontend

# Evita cachear los recursos durante el desarrollo
spring.web.resources.cache.period=0

# URL base del microservicio subsonic-users-auth (API bajo /v1)
subsonic.users-auth.url=${USERS_AUTH_API_URL:http://localhost:8000}
