# Configuración del servidor
server.port=${SERVER_PORT:8080}
spring.application.name=subsonic-frontend

# Evita cachear los recursos durante el desarrollo
spring.web.resources.cache.period=0
spring.thymeleaf.check-template-location=false

# URLs internas de los microservicios. El frontend solo comunica con este gateway.
subsonic.users-auth.url=${USERS_AUTH_API_URL:http://localhost:8000}
gateway.events-url=${GATEWAY_EVENTS_URL:http://localhost:8000}
gateway.artists-url=${GATEWAY_ARTISTS_URL:http://localhost:8002}
gateway.auth-url=${GATEWAY_AUTH_URL:http://localhost:8000}
gateway.inventory-url=${GATEWAY_INVENTORY_URL:http://localhost:8081}
gateway.grounds-url=${GATEWAY_GROUNDS_URL:http://localhost:8004}

# Vistas Thymeleaf sin cache durante el desarrollo
spring.thymeleaf.cache=false

# La sesion del navegador dura lo mismo que el JWT emitido por el microservicio
server.servlet.session.timeout=60m

# La sesion se transporta solo en la cookie JSESSIONID (sin ;jsessionid en URLs)
server.servlet.session.tracking-modes=cookie
