<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo, descripcion)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${descripcion}">
    <meta name="theme-color" content="#070709">
    <title th:text="${titulo}">Subsonic Festival 2027</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23d8ff3e'/%3E%3Ctext x='50' y='73' font-family='Arial Black,Arial,sans-serif' font-size='64' font-weight='900' text-anchor='middle' fill='%23070709'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
</head>
<body>

<header th:fragment="cabeceraPublica" class="site-header">
    <div class="container header__inner">
        <a class="logo" th:href="@{/index.html}" aria-label="Subsonic Festival, volver al inicio">
            <span class="logo__mark" aria-hidden="true">S</span>
            <span class="logo__text">Subsonic<span>Festival 2027</span></span>
        </a>

        <nav class="site-nav" aria-label="Navegación principal">
            <a th:href="@{/index.html#cartel}">Cartel</a>
            <a th:href="@{/index.html#experiencia}">Experiencia</a>
            <a th:href="@{/index.html#entradas}">Entradas</a>
            <a th:href="@{/index.html#ubicacion}">Ubicación</a>
        </nav>

        <a class="btn btn--ghost btn--small" th:href="@{/index.html}">Volver al inicio</a>
    </div>
</header>

<header th:fragment="cabeceraCuenta(activa)" class="site-header">
    <div class="container header__inner account-header__inner">
        <a class="logo" th:href="@{/index.html}" aria-label="Subsonic Festival, volver al inicio">
            <span class="logo__mark" aria-hidden="true">S</span>
            <span class="logo__text">Subsonic<span>Festival 2027</span></span>
        </a>

        <nav class="site-nav" aria-label="Navegación principal">
            <a th:href="@{/index.html}">Inicio</a>
            <a th:href="@{/perfil}"
               th:attr="aria-current=${activa == 'perfil' ? 'page' : null}"
               th:classappend="${activa == 'perfil' ? 'is-active' : ''}">Mi perfil</a>
            <a th:if="${usuarioActual != null and usuarioActual.rol == 'admin'}"
               th:href="@{/admin}"
               th:attr="aria-current=${activa == 'admin' ? 'page' : null}"
               th:classappend="${activa == 'admin' ? 'is-active' : ''}">Panel admin</a>
        </nav>

        <div class="account-header__actions">
            <span class="user-chip">
                <span class="user-chip__avatar" aria-hidden="true"
                      th:text="${usuarioActual != null ? iniciales : '?'}">?</span>
                <span class="user-chip__name"
                      th:text="${usuarioActual != null ? usuarioActual.nombre : 'Mi cuenta'}">Mi cuenta</span>
            </span>
            <span class="account-header__divider" aria-hidden="true"></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn--ghost btn--small" type="submit">Salir</button>
            </form>
        </div>
    </div>
</header>

<footer th:fragment="pie" class="account-footer">
    <div class="container account-footer__inner">
        <p>© 2027 Subsonic Festival · Madrid</p>
        <p><a th:href="@{/index.html}">Volver a la página principal</a></p>
    </div>
</footer>

<div th:fragment="alertas">
    <div class="alert alert--error" role="alert" th:if="${error}">
        <span class="alert__icon" aria-hidden="true">!</span>
        <p th:text="${error}">Ha ocurrido un error.</p>
    </div>
    <div class="alert alert--success" role="status" th:if="${exito}">
        <span class="alert__icon" aria-hidden="true">✓</span>
        <p th:text="${exito}">Operación completada.</p>
    </div>
    <div class="alert alert--warning" role="status" th:if="${advertencia}">
        <span class="alert__icon" aria-hidden="true">!</span>
        <p th:text="${advertencia}">Aviso.</p>
    </div>
    <div class="alert" role="status"
         th:if="${mensaje}"
         th:classappend="${'alert--' + (tipoMensaje != null ? tipoMensaje : 'info')}">
        <span class="alert__icon" aria-hidden="true">i</span>
        <p th:text="${mensaje}">Información.</p>
    </div>
</div>

</body>
</html>
