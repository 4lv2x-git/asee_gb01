<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda · Subsonic Festival</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header"><div class="container header__inner">
        <a class="logo" href="/"><img class="logo__image" src="images/logoPrincipal.png" alt=""><span class="logo__text">Subsonic<span>Festival 2027</span></span></a>
        <nav class="site-nav"><a href="/festivales.html">Festivales</a><a class="nav-active" href="/tienda.html">Tienda</a><a href="/artistas.html">Artistas</a><a href="/blog.html">Blog</a></nav>
        <div class="header__actions"><a class="cart-button" href="/#cart"><span>Carrito</span></a><a class="icon-button" href="/login.html"><img src="images/User.png" alt="Cuenta"></a></div>
    </div></header>
    <main><section class="section store-page"><div class="container">
        <div class="store-hero">
            <p class="eyebrow">Subsonic Store</p>
            <h1>Merchandising<br><span class="text-lime">oficial.</span></h1>
        </div>
        <div class="store-toolbar">
            <input type="search" placeholder="Buscar productos" aria-label="Buscar productos">
            <div class="store-categories">
                <button class="active" type="button">Todos</button>
                <button type="button">Ropa</button>
                <button type="button">Accesorios</button>
                <button type="button">Coleccionables</button>
                <button type="button">Varios</button>
            </div>
        </div>
        <div class="placeholder-card store-empty"><strong>No hay productos disponibles</strong><p>El catálogo se conectará con el gestor de inventario. Esta sección conserva el diseño de la tienda sin activar compras todavía.</p><a class="btn btn--ghost" href="/festivales.html">Ver festivales</a></div>
    </div></section></main>
</body>
</html>
