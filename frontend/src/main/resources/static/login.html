<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Subsonic Festival</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <canvas id="neural-glow-canvas" aria-hidden="true"></canvas>
    <header class="auth-topbar">
        <a class="logo" href="/" aria-label="Subsonic Festival">
            <img class="logo__image" src="images/logoPrincipal.png" alt="">
            <span class="logo__text">Subsonic<span>Festival 2027</span></span>
        </a>
        <nav aria-label="Volver"><a href="/">Inicio</a><a href="/festivales.html">Festivales</a><a href="/recintos.html">Recintos</a></nav>
    </header>
    <div class="auth-orb auth-orb--one"></div>
    <div class="auth-orb auth-orb--two"></div>
    <main class="auth-layout">
        <section class="auth-card">
            <a class="auth-logo" href="/" aria-label="Volver al inicio">
                <img src="images/logoPrincipal.png" alt="Subsonic Festival">
            </a>
            <p class="eyebrow">Subsonic</p>
            <h1>Iniciar sesión</h1>
            <p class="auth-intro">Accede a tu cuenta para comprar entradas y gestionar tus pedidos.</p>

            <button class="google-button" type="button" id="googleLogin">
                <span aria-hidden="true">G</span>
                Iniciar sesión con Google
            </button>

            <div class="auth-divider"><span>o</span></div>

            <form id="loginForm" class="auth-form">
                <label for="loginEmail">Correo electrónico</label>
                <input id="loginEmail" type="email" autocomplete="email" placeholder="tu@email.com" required>
                <label for="loginPassword">Contraseña</label>
                <div class="auth-password">
                    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
                    <button type="button" id="togglePassword" aria-label="Mostrar contraseña">
                        <img src="images/OjoCerrado.png" alt="">
                    </button>
                </div>
                <button class="btn btn--primary btn--full" type="submit">Entrar</button>
                <p id="loginMessage" class="form-message" aria-live="polite"></p>
            </form>

            <a class="auth-link" href="/">Volver al inicio</a>
            <p class="auth-switch">¿No tienes registrada tu cuenta? <a href="/register.html">Hazte ahora</a></p>
        </section>
    </main>
    <script src="js/neural-glow.js"></script>
    <script src="js/auth-pages.js"></script>
</body>
</html>
